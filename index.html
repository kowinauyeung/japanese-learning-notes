<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>語彙庭</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      iOS reads neither the SVG favicon above nor the manifest's icons when it
      adds the app to the Home Screen. This tag is the only one it takes, so
      removing it does not fall back to a smaller icon — it falls back to a
      screenshot of the page.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Installability, and nothing else yet: there is no service worker, so an
      installed window is the same app in its own frame rather than one that
      works offline. Chromium withholds its install prompt until a service
      worker exists; iOS's Add to Home Screen does not, and works from here.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      One tag rather than a prefers-color-scheme pair: a saved theme overrides
      the OS preference, so the media query would leave the browser chrome on
      the opposite colour from the page. Both values live here so the script
      below and useTheme read one source instead of duplicating the hexes.

      The manifest cannot follow the theme this way — it holds one theme_color,
      read once at install time — so it carries the light value. Where the two
      disagree this tag wins for browser chrome, and the manifest's is what the
      launch splash screen uses.
    -->
    <meta name="theme-color" content="#f7fbf9" data-light="#f7fbf9" data-dark="#0d1a16" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      (() => {
        const saved = localStorage.getItem('theme');
        const dark =
          saved === 'dark' ||
          ((!saved || saved === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        const theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = meta.dataset[theme];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
