name: PR title

# Every merge into `develop` is a squash merge, so the pull request title — not
# anything on the branch — is the commit message that lands. Since the release
# derives the version from those messages (see docs/releasing.md), a title with
# the wrong prefix does not just read badly: it silently changes the next
# version number, and nothing downstream can tell that it was a mistake.
#
# `edited` matters as much as `opened`: a title is most often fixed after the
# pull request exists.
#
# `synchronize` is here so the check re-reports against each new head commit.
# Status checks attach to a SHA, so without it a pushed commit would leave the
# check missing rather than green.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# A new push supersedes the run before it; there is nothing to preserve.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # The type list is deliberately spelled out rather than left to the
      # action's default, because it has to agree with the changelog preset in
      # .versionrc.json: `feat`, `fix`, `perf` and `revert` bump the version and
      # appear in CHANGELOG.md; the rest do neither. A type accepted here but
      # unknown there would land a commit that the release silently ignores.
      #
      # `chore` covers the release commit itself — `chore(release): v1.0.0` —
      # so the release pull request passes this check without an exception.
      #
      # Pinned to a commit rather than to `v6`, unlike the `actions/*` steps in
      # the other workflows. Those are GitHub's own; this is the first
      # third-party action in the repository, and a moving tag on one is a
      # write someone else can make to what runs here. Dependabot updates the
      # SHA and the comment together — see .github/dependabot.yml.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            style
            chore
            refactor
            test
            build
            ci
          # The title alone is not enough, because GitHub does not always use
          # it. `squash_merge_commit_title` is `COMMIT_OR_PR_TITLE`, and on a
          # pull request with exactly one commit the squash dialog offers that
          # commit's message instead — so a title this check passed as `feat:`
          # can land on `develop` as `chore:` and quietly change the next
          # version. The action's own documentation describes this case, and
          # these two options close it: the single commit is validated too, and
          # it has to say the same thing the title does, so whichever GitHub
          # picks is the same string.
          #
          # Setting the repository's `squash_merge_commit_title` to `PR_TITLE`
          # fixes it as well, and is worth doing. It is not enough on its own:
          # a repository setting is invisible to a reader of this file and can
          # be changed without review, whereas this is version-controlled.
          validateSingleCommit: true
          validateSingleCommitMatchesPrTitle: true
          # Scopes are optional here. Most titles carry one, but a change that
          # genuinely spans the app — "fix: minor UI cleanups on account,
          # dashboard and footer" — should not have to invent a false one.
          requireScope: false
          # Imperative mood, no leading capital, no full stop: what CLAUDE.md
          # already asks for and what every commit since v0.1.0 does.
          #
          # It forbids a leading capital rather than requiring `[a-z]`, because
          # CLAUDE.md also says identifiers are quoted exactly as they appear in
          # the code — so "`pwa-config.ts` gains a version signal" is a correct
          # title and starts with a backtick. A capital is the thing actually
          # worth catching: it reads as a sentence rather than a commit subject.
          # The message below says what is enforced, not something narrower.
          subjectPattern: '^(?![A-Z])(?!.*\.$).+$'
          subjectPatternError: |
            The subject "{subject}" in "{title}" is not in the repository's form.
            Do not start it with a capital letter, and do not end it with a full stop.
