name: Deploy (dev)

on:
  push:
    branches: [develop]
  # Every pull request except those into `main` and `release/**`.
  #
  # `release/**` and not `release/*`: GitHub's filter patterns follow the same
  # rule as globs, so `*` stops at a `/` and `**` does not. `release/2026/q1`
  # would be described by the narrower pattern and not matched by it.
  #
  # The deploy job checks out the pull request's **base** on purpose — it holds
  # a credential, so it must not run the pull request's own code — and that
  # assumes the base carries the toolchain. A release pull request into `main`
  # broke the assumption rather than the rule: `main` had no `.nvmrc`, so
  # `setup-node` failed four seconds in and put a red check on the release. Not
  # a required check, so it blocked nothing — worse than that, a red light
  # nobody is meant to act on, on the one pull request where somebody should be
  # reading every light.
  #
  # **`branches-ignore` rather than `branches: [develop]`, and stacked pull
  # requests are why.** A pull request based on another feature branch has a
  # base that does carry the toolchain; it was never broken, and an allowlist
  # would have taken its preview away as collateral. `ci.yml` argues the same
  # case for verification in so many words — filtering on the base leaves a
  # stacked pull request unchecked until it is retargeted, which is exactly when
  # it is easiest to merge something red. Verification and a preview deploy are
  # different obligations, but not different enough to reach opposite
  # conclusions here without saying so.
  pull_request:
    branches-ignore: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: deploy-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the pull request's own code, so it is treated as untrusted: no
  # id-token permission, no Google credential, nothing a build could steal and
  # escalate with. A dependency's postinstall script counts as the pull
  # request's code too, which is why the split is by job and not by step.
  build:
    # A fork's pull request must never reach these secrets. GitHub already
    # withholds them from fork runs, so the job would fail rather than leak,
    # but skipping outright keeps the pull request green instead of red for a
    # reason the contributor cannot fix.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Vite inlines VITE_-prefixed variables from the environment at build
      # time, taking precedence over .env.production — which is gitignored, so
      # the runner has none. Scoped to this step rather than the job so that
      # install-time scripts never see them.
      #
      # These ship inside the bundle and can be read from the deployed site by
      # anyone; rules, not secrecy, protect the data. They are secrets only
      # because the repo is public and a scraped key invites quota abuse.
      #
      # The reCAPTCHA key differs from the six above in one way that matters:
      # the others are required and the build throws without them, while this
      # one is optional and its absence means App Check is simply off. The
      # client says so in the browser console, where a CI run has nobody
      # looking — hence the annotation below, which puts it on the run summary.
      - name: Warn when App Check is unconfigured
        env:
          KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning title=App Check::VITE_RECAPTCHA_SITE_KEY is not set. This build ships without App Check: the Firebase config in it is public, and nothing attests that a request came from this app."
          fi

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        run: yarn build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  # Holds the credentials and runs no code from the pull request. It checks out
  # the base branch, so firebase-tools comes from a lockfile that is already
  # merged, and takes only dist/ from the build job.
  #
  # The consequence worth knowing: on a pull request, firebase.json and
  # .firebaserc are the base branch's. A pull request that changes hosting
  # config will not see that change in its own preview. Config belongs on the
  # trusted path, so that is the intended behaviour rather than a gap.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    # Consumed by `authorize`, which deliberately checks out nothing and so has
    # no other way to learn either fact.
    outputs:
      configured: ${{ steps.gate.outputs.configured }}
      preview-url: ${{ steps.preview.outputs.url }}

    steps:
      # Until the federation provider exists there is nothing to deploy to, and
      # failing every pull request over a setup step nobody has done yet trains
      # people to ignore a red check. Report and stop.
      #
      # The secrets context is not available to a job-level `if`, which is why
      # this is a step rather than a condition on the job.
      - name: Check for deploy credentials
        id: gate
        env:
          PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -n "$PROVIDER" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Deploy skipped: GCP_WORKLOAD_IDENTITY_PROVIDER is not set. See README → Deploy credentials.'
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.configured == 'true'
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          cache: yarn

      # Installed before authenticating, so even a trusted postinstall script
      # runs with no credential in the environment.
      - name: Install firebase-tools
        if: steps.gate.outputs.configured == 'true'
        run: yarn install --frozen-lockfile

      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.configured == 'true'
        with:
          name: dist
          path: dist

      - uses: google-github-actions/auth@v3
        if: steps.gate.outputs.configured == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # Hosting and rules together, and only from develop. `--project dev` is
      # the .firebaserc alias for goitei-dev; prod is not reachable from this
      # workflow at all.
      - name: Deploy to goitei-dev
        if: steps.gate.outputs.configured == 'true' && github.event_name == 'push'
        run: yarn firebase deploy --only hosting,firestore:rules --project dev --non-interactive

      # A preview channel is hosting-only on purpose. Rules are project-wide,
      # so deploying them from a pull request would change the rules every
      # other preview and the dev site itself are running under.
      - name: Deploy preview channel
        id: preview
        if: steps.gate.outputs.configured == 'true' && github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          ./node_modules/.bin/firebase hosting:channel:deploy "pr-$PR" \
            --project dev --expires 7d --non-interactive --json > channel.json
          echo "url=$(jq -r '.result | to_entries[0].value.url' channel.json)" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL
        if: steps.gate.outputs.configured == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          printf '%s\n\n%s\n' \
            "Preview: $URL" \
            "Serves this branch against the **goitei-dev** Firestore — the same data as the dev site, not a copy. Expires in 7 days." \
            > body.md
          gh pr comment "$PR" --body-file body.md --edit-last --create-if-none

  # Google sign-in refuses an origin that is not on Firebase Auth's authorized
  # domain list, and a preview channel's hostname carries a hash that is
  # generated per channel — so every pull request lands on a domain nobody has
  # ever seen before. The list takes no wildcard, which leaves three options:
  # add each one by hand, ship previews that cannot sign in, or do this.
  #
  # The alternative worth naming, because it looks cheaper than it is: build
  # previews with `yarn build:e2e`, whose in-memory adapters sign a user in
  # without Google at all. That trades away the thing a preview is for. The
  # comment below promises real goitei-dev data, and a Firestore query, index
  # or cursor defect — the class of bug that has actually reached review here —
  # is invisible against fakes.
  #
  # Runs as its own job rather than a step in `deploy` because of `concurrency`
  # below, and takes the opportunity to check out nothing at all: it needs a
  # token, `curl` and `jq`, none of which come from this repository.
  authorize:
    needs: deploy
    if: github.event_name == 'pull_request' && needs.deploy.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    # The API offers no etag and no atomic append, so the update is
    # read-modify-write and two pull requests deploying at once would leave one
    # of the two domains off the list. The group is deliberately repository-wide
    # rather than per pull request — serialising against *other* pull requests
    # is the entire point — and `cancel-in-progress` stays false, because a
    # cancelled write here is a preview that cannot sign in.
    #
    # `preview-cleanup.yml` names the same group, so a prune cannot interleave
    # with an append either.
    concurrency:
      group: firebase-auth-authorized-domains
      cancel-in-progress: false

    steps:
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          # `deploy` takes the credentials file and lets firebase-tools find it.
          # This job talks to the Identity Toolkit admin API over plain HTTP, so
          # it asks for the bearer token directly.
          token_format: access_token

      - name: Authorize the preview domain for Google sign-in
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          URL: ${{ needs.deploy.outputs.preview-url }}
          # The .firebaserc `dev` alias, spelled out because this job checks out
          # no repository to read it from.
          PROJECT: goitei-dev
        run: |
          set -euo pipefail

          host=${URL#https://}
          host=${host%%/*}
          if [ -z "$host" ]; then
            echo "::error::No preview URL to authorize."
            exit 1
          fi

          api="https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/config"
          domains=$(curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" "$api" |
            jq -c '.authorizedDomains // []')

          # Re-running a deploy on the same pull request reuses the channel and
          # therefore the hostname, so this is the common case, not the edge one.
          if jq -e --arg h "$host" 'index($h)' <<<"$domains" >/dev/null; then
            echo "::notice::$host is already authorized."
            exit 0
          fi

          curl -sS --fail-with-body -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            "$api?updateMask=authorizedDomains" \
            -d "$(jq -c --arg h "$host" '{authorizedDomains: (. + [$h])}' <<<"$domains")" \
            >/dev/null

          echo "::notice::Authorized $host for Google sign-in."
