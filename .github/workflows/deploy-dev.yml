name: Deploy (dev)

on:
  push:
    branches: [develop]
  # Every pull request except those into `main` and `release/**`.
  #
  # `release/**` and not `release/*`: GitHub's filter patterns follow the same
  # rule as globs, so `*` stops at a `/` and `**` does not. `release/2026/q1`
  # would be described by the narrower pattern and not matched by it.
  #
  # The deploy job checks out the pull request's **base** on purpose — it holds
  # a credential, so it must not run the pull request's own code — and that
  # assumes the base carries the toolchain. A release pull request into `main`
  # broke the assumption rather than the rule: `main` had no `.nvmrc`, so
  # `setup-node` failed four seconds in and put a red check on the release. Not
  # a required check, so it blocked nothing — worse than that, a red light
  # nobody is meant to act on, on the one pull request where somebody should be
  # reading every light.
  #
  # **`branches-ignore` rather than `branches: [develop]`, and stacked pull
  # requests are why.** A pull request based on another feature branch has a
  # base that does carry the toolchain; it was never broken, and an allowlist
  # would have taken its preview away as collateral. `ci.yml` argues the same
  # case for verification in so many words — filtering on the base leaves a
  # stacked pull request unchecked until it is retargeted, which is exactly when
  # it is easiest to merge something red. Verification and a preview deploy are
  # different obligations, but not different enough to reach opposite
  # conclusions here without saying so.
  pull_request:
    branches-ignore: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: deploy-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the pull request's own code, so it is treated as untrusted: no
  # id-token permission, no Google credential, nothing a build could steal and
  # escalate with. A dependency's postinstall script counts as the pull
  # request's code too, which is why the split is by job and not by step.
  build:
    # A fork's pull request must never reach these secrets. GitHub already
    # withholds them from fork runs, so the job would fail rather than leak,
    # but skipping outright keeps the pull request green instead of red for a
    # reason the contributor cannot fix.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Vite inlines VITE_-prefixed variables from the environment at build
      # time, taking precedence over .env.production — which is gitignored, so
      # the runner has none. Scoped to this step rather than the job so that
      # install-time scripts never see them.
      #
      # These ship inside the bundle and can be read from the deployed site by
      # anyone; rules, not secrecy, protect the data. They are secrets only
      # because the repo is public and a scraped key invites quota abuse.
      #
      # The reCAPTCHA key differs from the six above in one way that matters:
      # the others are required and the build throws without them, while this
      # one is optional and its absence means App Check is simply off. The
      # client says so in the browser console, where a CI run has nobody
      # looking — hence the annotation below, which puts it on the run summary.
      - name: Warn when App Check is unconfigured
        env:
          KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning title=App Check::VITE_RECAPTCHA_SITE_KEY is not set. This build ships without App Check: the Firebase config in it is public, and nothing attests that a request came from this app."
          fi

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        run: yarn build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  # Holds the credentials and runs no code from the pull request. It checks out
  # the base branch, so firebase-tools comes from a lockfile that is already
  # merged, and takes only dist/ from the build job.
  #
  # The consequence worth knowing: on a pull request, firebase.json and
  # .firebaserc are the base branch's. A pull request that changes hosting
  # config will not see that change in its own preview. Config belongs on the
  # trusted path, so that is the intended behaviour rather than a gap.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      # Until the federation provider exists there is nothing to deploy to, and
      # failing every pull request over a setup step nobody has done yet trains
      # people to ignore a red check. Report and stop.
      #
      # The secrets context is not available to a job-level `if`, which is why
      # this is a step rather than a condition on the job.
      - name: Check for deploy credentials
        id: gate
        env:
          PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -n "$PROVIDER" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Deploy skipped: GCP_WORKLOAD_IDENTITY_PROVIDER is not set. See README → Deploy credentials.'
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.configured == 'true'
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          cache: yarn

      # Installed before authenticating, so even a trusted postinstall script
      # runs with no credential in the environment.
      - name: Install firebase-tools
        if: steps.gate.outputs.configured == 'true'
        run: yarn install --frozen-lockfile

      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.configured == 'true'
        with:
          name: dist
          path: dist

      - uses: google-github-actions/auth@v3
        id: auth
        if: steps.gate.outputs.configured == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          # firebase-tools finds the credentials file on its own. The bearer
          # token is for the verification step at the end, which talks to the
          # Identity Toolkit admin API over plain HTTP.
          token_format: access_token

      # Hosting and rules together, and only from develop. `--project dev` is
      # the .firebaserc alias for goitei-dev; prod is not reachable from this
      # workflow at all.
      - name: Deploy to goitei-dev
        if: steps.gate.outputs.configured == 'true' && github.event_name == 'push'
        run: yarn firebase deploy --only hosting,firestore:rules --project dev --non-interactive

      # Before the preview deploy, not after: `firebase hosting:channel:deploy`
      # below uploads `dist/` as it finds it, so the token has to already be in
      # `dist/index.html` by the time that step runs. After `auth`, so the
      # Admin SDK inherits the same Workload Identity credential that
      # authenticates `firebase deploy` — `createToken` needs no attestation
      # of its own, because holding Google credentials for the project is
      # already what reCAPTCHA exists to prove.
      #
      # A preview channel cannot pass reCAPTCHA v3 attestation at all: v3 site
      # keys are registered against specific domains in the reCAPTCHA admin
      # console — a separate list from the Firebase Auth one the step below
      # this manages — and a channel's hostname is a hash generated per pull
      # request, so nobody has ever registered it there. See
      # `src/infra/firebase/client.ts` for the client side of this and
      # `admin/mint-preview-app-check-token.ts` for what it needs.
      #
      # **Needs `roles/firebaseappcheck.admin`** (or an equivalent role) on
      # the deploying service account, which has not been exercised against a
      # live project as of this step's introduction. Fails the job rather than
      # deploying without a token — for the same reason `firebase deploy`
      # itself is not allowed to warn-and-succeed below: a preview that looks
      # deployed and cannot attest is a worse outcome than a red check.
      - name: Mint a preview App Check token
        if: steps.gate.outputs.configured == 'true' && github.event_name == 'pull_request'
        env:
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          yarn mint-preview-appcheck-token \
            --app-id "$VITE_FIREBASE_APP_ID" \
            --project goitei-dev \
            --dist dist/index.html

      # A preview channel is hosting-only on purpose. Rules are project-wide,
      # so deploying them from a pull request would change the rules every
      # other preview and the dev site itself are running under.
      - name: Deploy preview channel
        id: preview
        if: steps.gate.outputs.configured == 'true' && github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.pull_request.number }}
        # `--expires 6d`, not 7: the token above is minted with the Admin
        # SDK's own maximum TTL — 7 days, fixed, not something this
        # repository chose — and its clock starts at mint time, a little
        # before this step's clock starts. A channel that also ran the full
        # 7 days would let the last sliver of its life outlive the token
        # minted for it. Shortening the channel by a day costs a day of
        # review time and buys a preview that expires quietly with
        # everything else, rather than one whose token quietly expires
        # first while the channel looks alive.
        run: |
          ./node_modules/.bin/firebase hosting:channel:deploy "pr-$PR" \
            --project dev --expires 6d --non-interactive --json > channel.json
          echo "url=$(jq -r '.result | to_entries[0].value.url' channel.json)" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL
        if: steps.gate.outputs.configured == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          printf '%s\n\n%s\n' \
            "Preview: $URL" \
            "Serves this branch against the **goitei-dev** Firestore — the same data as the dev site, not a copy. Expires in 6 days." \
            > body.md
          gh pr comment "$PR" --body-file body.md --edit-last --create-if-none

      # Google sign-in refuses an origin that is not on Firebase Auth's
      # authorized domain list, and a channel's hostname carries a hash
      # generated per channel, so every preview lands on a domain nobody has
      # ever seen. `firebase hosting:channel:deploy` adds it to the list itself
      # — `--no-authorized-domains` turns that off, and the step above does not
      # pass it — and prunes the `goitei-dev--` domains no live channel claims
      # while it is there.
      #
      # That call is also why previews could not sign in for weeks without
      # anyone finding out. It needs `roles/firebaseauth.admin`, the service
      # account did not have it, and firebase-tools answers a failure here with
      # a warning and a successful deploy. `--json` above suppresses even the
      # warning. The preview deployed, the comment below promised a working
      # preview, and sign-in was broken on it for the seven days it lived.
      #
      # So this asks the question the deploy will not. Two things put the
      # hostname back out of the list, and neither shows up as a failure:
      # the role being revoked, and a concurrent channel deploy — the CLI reads
      # the list, appends to it and writes it back, and the admin API offers no
      # etag between the read and the write, so the later writer drops the
      # earlier one's domain.
      #
      # Read-only, runs after the comment so a reviewer still gets the link,
      # and a re-run of the job is the fix in both cases.
      - name: Verify the preview domain is authorized for Google sign-in
        if: steps.gate.outputs.configured == 'true' && github.event_name == 'pull_request'
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          URL: ${{ steps.preview.outputs.url }}
          # The .firebaserc `dev` alias, spelled out: this reads the project's
          # auth config rather than deploying to it, and takes no alias.
          PROJECT: goitei-dev
        run: |
          set -euo pipefail

          host=${URL#https://}
          host=${host%%/*}
          if [ -z "$host" ]; then
            echo "::error::No preview URL to check."
            exit 1
          fi

          # `--fail-with-body` writes the API's own explanation to stdout before
          # exiting non-zero, and capturing it is what makes that worth having:
          # piping it into `jq` or to /dev/null hands the explanation to
          # something that discards it, and leaves the run log holding a bare
          # `curl: (22) ... 403` that cannot tell a missing
          # `roles/firebaseauth.admin` apart from a disabled Identity Toolkit
          # API. The body is echoed on its own line rather than interpolated
          # into the `::error::`, because a workflow annotation keeps only its
          # first line and these responses are multi-line JSON.
          api="https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/config"
          if ! config=$(curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" "$api"); then
            echo "$config"
            echo "::error::Could not read the Firebase Auth config for $PROJECT. See the response above."
            exit 1
          fi

          if jq -e --arg h "$host" '.authorizedDomains // [] | index($h)' <<<"$config" >/dev/null; then
            echo "::notice::$host is authorized for Google sign-in."
            exit 0
          fi

          echo "::error::$host was deployed but is not on the Firebase Auth authorized domain list, so Google sign-in will fail on this preview. Check that the deploy service account still holds roles/firebaseauth.admin, then re-run this job. See README → Preview sign-in."
          exit 1
